# k4mlTau default settings (shared by all users).
# Paths are given on the command line, e.g.
#     python3 scripts/run_mltau.py --workflow condor --input-dir <dir> --output-dir <dir>
# Any value here can be overridden with the corresponding --option.
#
# workflow can be "local", "slurm" (e.g. Manivald) or "condor" (e.g. lxplus HTCondor).

workflow = "local"
input_dir = "/path/to/edm4hep/root/files"
output_dir = "outputs"
model_bundle = "models/mlTau_0612_multipartau_full_b8483f6"

# Use -1 for all input ROOT files.
max_files = -1
files_per_output = 20

input_particles = "PandoraPFOs"
key4hep_release = "2026-04-08"

[slurm]
job_name = "mltau"
# Optional examples. Leave unset if your cluster defaults are fine.
# partition = "short"
# time = "02:00:00"
# mem = "4G"
# cpus_per_task = 1
# extra_args = ["--account=my_account"]

[condor]
job_name = "mltau"
job_flavour = "espresso"   # lxplus: espresso 20 min, microcentury 1 h, longlunch 2 h, workday 8 h
# Optional. HTCondor logs must not be on EOS; default is condor_logs/ in the repository.
# log_dir = "condor_logs"
# request_cpus = 1
# request_memory = "2 GB"
# extra_lines = ["+AccountingGroup = \"group_u_XXX\""]
